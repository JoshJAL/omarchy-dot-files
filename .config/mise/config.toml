[tools]
"aqua:supabase/cli" = "latest"
bun = "latest"
"github:microsoftgraph/msgraph-cli" = { version = "latest", exe = "mgc" }
java = "latest"
"npm:mex-agent" = { version = "latest", allow_low_downloads = true }
"npm:vercel" = { version = "latest", trust_policy_excludes = ["@vercel/backends", "@vercel/build-utils", "@vercel/cervel", "@vercel/cli-auth", "@vercel/cli-config", "@vercel/cli-exec", "@vercel/container", "@vercel/detect-agent", "@vercel/elysia", "@vercel/error-utils", "@vercel/express", "@vercel/fastify", "@vercel/gatsby-plugin-vercel-analytics", "@vercel/gatsby-plugin-vercel-builder", "@vercel/go", "@vercel/h3", "@vercel/hono", "@vercel/hydrogen", "@vercel/koa", "@vercel/nestjs", "@vercel/next", "@vercel/node", "@vercel/oidc", "@vercel/python", "@vercel/python-analysis", "@vercel/redwood", "@vercel/remix-builder", "@vercel/ruby", "@vercel/rust", "@vercel/static-build", "@vercel/static-config", "@vercel/vc-native-darwin-arm64", "@vercel/vc-native-darwin-x64", "@vercel/vc-native-linux-arm64", "@vercel/vc-native-linux-x64", "@vercel/vc-native-win32-x64", "vercel"] }
opencode = { version = "latest", allow_builds = ["@opencode/cli"], minimum_release_age = "0s", lazy = true, auto_update = "4h" }
pnpm = "latest"

[env]
# Use sharp's bundled libvips instead of building against the pacman libvips
SHARP_IGNORE_GLOBAL_LIBVIPS = "1"

[settings]
minimum_release_age = "0"
idiomatic_version_file_enable_tools = ["node"]

[settings.upgrade]
